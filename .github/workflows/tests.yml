name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ''
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: install uv
        run: pip install uv

      - name: sync dependencies
        run: uv sync --frozen

      - name: run pytest
        run: |
          set +e
          uv run pytest tests -q -p no:cacheprovider 2>&1 | tee pytest-out.txt
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)" pytest-out.txt | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit "$status"

      - name: upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: frontend vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        working-directory: frontend
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee npm-out.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -8 npm-out.txt | while IFS= read -r line; do
              echo "::error title=npm ci::${line}"
            done
          fi
          exit "$status"

      - name: run vitest
        working-directory: frontend
        run: npx vitest run
