name: Harness regression

on:
  pull_request:
    paths: ['app/**', 'scripts/eval/**', 'eval/harness/v1/**', 'eval/learning/**', 'tests/**', 'data/catalog-v1.jsonl', 'Makefile', 'pyproject.toml', 'uv.lock', '.github/workflows/harness-eval.yml']
  push:
    branches: [main]
    paths: ['app/**', 'scripts/eval/**', 'eval/harness/v1/**', 'eval/learning/**', 'tests/**', 'data/catalog-v1.jsonl', 'Makefile', 'pyproject.toml', 'uv.lock', '.github/workflows/harness-eval.yml']
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [smoke, dev, release]
        default: smoke

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety-contracts:
    name: Offline safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ''
      REDIS_URL: ''
      LANGFUSE_SECRET_KEY: ''
      LANGFUSE_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Safety contracts without model credentials
        run: uv run python -m scripts.eval.harness run --profile contracts --output eval/verification/ci-contracts
      - name: Preserve contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/verification/ci-contracts
          retention-days: 30

  model-evaluation:
    name: Real model evaluation
    needs: safety-contracts
    # 真实模型评测会产生费用、最长 180 分钟，不适合挂在每次 push 上；
    # 改为手动触发（Actions → Run workflow → 选 profile）。离线契约仍在 push 时自动跑。
    if: github.event_name == 'workflow_dispatch' || vars.HARNESS_AUTO_EVAL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LLM_BASE_URL: ${{ secrets.HARNESS_LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.HARNESS_LLM_API_KEY }}
      LLM_MODEL: ${{ vars.HARNESS_LLM_MODEL || 'qwen3.8-flash' }}
      LLM_FALLBACK_MODEL: ''
      REDIS_URL: ''
      LANGFUSE_SECRET_KEY: ''
      LANGFUSE_PUBLIC_KEY: ''
      # 精排走独立服务（如硅基流动），与主模型网关不同源，必须单独配凭据。
      # 未设 HARNESS_RERANKER_MODE 时保持 disabled，检索按向量分排序，与本地默认一致。
      RERANKER_MODE: ${{ vars.HARNESS_RERANKER_MODE || 'disabled' }}
      RERANKER_BASE_URL: ${{ secrets.HARNESS_RERANKER_BASE_URL }}
      RERANKER_MODEL: ${{ vars.HARNESS_RERANKER_MODEL }}
      RERANKER_API_KEY: ${{ secrets.HARNESS_RERANKER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: 检查评测凭据
        env:
          KEY: ${{ secrets.HARNESS_LLM_API_KEY }}
          BASE: ${{ secrets.HARNESS_LLM_BASE_URL }}
        run: |
          if [ -z "$KEY" ] || [ -z "$BASE" ]; then
            echo "::error title=评测凭据未配置::此 job 需要仓库 secret HARNESS_LLM_API_KEY 与 HARNESS_LLM_BASE_URL。缺失时按项目约定标记为未通过，不静默跳过。"
            exit 1
          fi
      - name: 检查精排配置
        if: vars.HARNESS_RERANKER_MODE == 'http'
        env:
          BASE: ${{ secrets.HARNESS_RERANKER_BASE_URL }}
          KEY: ${{ secrets.HARNESS_RERANKER_API_KEY }}
          MODEL: ${{ vars.HARNESS_RERANKER_MODEL }}
        run: |
          if [ -z "$BASE" ] || [ -z "$KEY" ] || [ -z "$MODEL" ]; then
            echo "::error title=精排凭据未配置::RERANKER_MODE=http 但 HARNESS_RERANKER_BASE_URL / HARNESS_RERANKER_API_KEY / HARNESS_RERANKER_MODEL 有缺失。缺失时检索会静默退回按向量分排序，这轮结论不能用于判断精排效果。"
            exit 1
          fi

      - name: Real model evaluation
        env:
          HARNESS_PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          if [ "$HARNESS_PROFILE" = release ]; then
            uv run python -m scripts.eval.harness run --profile release --output eval/verification/ci-model --require-benefit
          else
            uv run python -m scripts.eval.harness run --profile "$HARNESS_PROFILE" --output eval/verification/ci-model
          fi
          uv run python -m scripts.eval.harness verify eval/verification/ci-model
      - name: Preserve HTML and raw failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/verification/ci-model
          retention-days: 30
